name: Terraform

on:

  # Feature branch par push -> PLAN
  push:
    branches:
      - "**"

  # PR -> main -> PLAN
  pull_request:
    branches:
      - main

  # Manual run
  workflow_dispatch:

jobs:

  terraform:

    name: Terraform
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Create terraform.tfvars
      - name: Create Terraform Variables
        env:
          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}
        run: |
          printf '%s' "$TFVARS_CONTENT" > environment/dev/terraform.tfvars

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Azure Login
      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "efa612e2-52ae-4608-adaf-e792898d130b" \
            --password "s6T8Q~YomF6Kc_iISy~4VXwpKXG5UIWAk0V5gbtk" \
            --tenant "c19495c3-7313-414d-bf97-f60a4fbc2c0d"

      # 5. Azure Subscription
      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "9d42e269-3739-4811-a09c-a7fe1e4e9c7a"

      # 6. Check Azure
      - name: Azure Account
        run: |
          az account show

      # 7. Terraform Init
      - name: Terraform Init
        working-directory: environment/dev
        run: terraform init

      # 8. Terraform Format
      - name: Terraform Format
        working-directory: environment/dev
        run: terraform fmt -check -recursive

      # 9. Terraform Validate
      - name: Terraform Validate
        working-directory: environment/dev
        run: terraform validate

      # 10. Terraform Plan
      - name: Terraform Plan
        working-directory: environment/dev
        run: terraform plan -input=false -var-file="terraform.tfvars"

      # 11. Terraform Apply
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: environment/dev
        run: |
          terraform apply -auto-approve -input=false -var-file="terraform.tfvars"